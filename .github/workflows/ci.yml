name: Go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

# A run is superseded only on a pull request. On main the group is unique per
# ref and commit, so no run is ever cancelled: the main run cuts the version
# tag (strongo/cicd go_bump) and must complete for every merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: true

jobs:
  strongo_workflow:
    # Merges to main are tagged by CI (strongo/cicd go_bump), so a tag must
    # never be cut for a commit whose real-server run failed: this job, and
    # with it the reusable workflow's Bump version job, starts only when
    # `integration` succeeded. A job whose `needs` did not succeed is skipped
    # unless it carries an always()/failure() condition, which this one
    # deliberately does not.
    needs: [integration]
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@main
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      cgo_enabled: false
      code_coverage: true
      # This job runs without a server, so TestServer skips and only the unit
      # and sqlmock tests count; they cover every statement.
      min_test_coverage_percent: 100

  # Runs TestServer against a real SQL Server 2022.
  #
  # This lives here rather than in strongo/cicd on purpose: service containers
  # cannot be passed into a reusable workflow by its caller, and `services:`
  # cannot be made conditional.
  integration:
    name: Real server (SQL Server 2022)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mssql:
        # The server image, pinned by digest (SQL Server 2022,
        # mcr.microsoft.com/mssql/server:2022-latest on 2026-10-16, the digest
        # datatug/datatug-cli's SQL Server journey uses). A bot that updates the
        # digest must also re-run this job: that is what the job is for.
        #
        # LICENCE: this image is Microsoft SQL Server Developer edition, and
        # running it needs ACCEPT_EULA=Y. That accepts the image's end-user
        # licence agreement. The founder decided on 2026-10-16 (decision D10)
        # that CI may accept it for AUTOMATED TESTING ONLY: the Developer edition
        # is licensed for development and testing, never production. The image
        # is pulled and thrown away with the runner; it is never redistributed,
        # republished or copied into a release.
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
        env:
          ACCEPT_EULA: 'Y'
          # A throwaway password of a server that lives as long as the job and
          # listens on the runner's loopback only.
          MSSQL_SA_PASSWORD: Dalgo2mssql-Test1
        ports:
          - 1433:1433
        # sqlcmd ships in the image; -C trusts the server's self-signed
        # certificate.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Dalgo2mssql-Test1 -b -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test (with a live SQL Server)
        # `go test` prints "ok" for a package whose tests all SKIPPED, so a
        # green job here would not by itself prove TestServer ran — which is
        # exactly the vacuously-green outcome this job exists to prevent. Run
        # verbose and assert on the result lines. -count=1 keeps the test cache
        # out: a cached package replays the PASS lines of an earlier run. The
        # coverage gate is strongo_workflow's alone: the unit tests cover every
        # statement without a server.
        run: |
          set -o pipefail
          go test -v -count=1 ./... 2>&1 | tee /tmp/gotest.log
          if grep -qE '^\s*--- SKIP: ' /tmp/gotest.log; then
            echo "::error::a test SKIPPED - the server URL did not reach the tests"
            exit 1
          fi
          # A PASS line is required for TestServer and each of its sub-tests by
          # name, so a sub-test that is renamed, deleted or never reached fails
          # the job. Add a new sub-test to this list.
          for name in \
            TestServer \
            TestServer/ListCollections \
            TestServer/DescribeCollection \
            TestServer/ListIndexes \
            TestServer/ListConstraints \
            TestServer/ListReferrers \
            TestServer/WithSchema \
            TestServer/QueryPath \
            TestServer/bad_password_leaks_nothing; do
            if ! grep -qE "^\s*--- PASS: ${name} \(" /tmp/gotest.log; then
              echo "::error::${name} did not run to a pass"
              exit 1
            fi
          done
        env:
          DALGO2MSSQL_TEST_URL: sqlserver://sa:Dalgo2mssql-Test1@127.0.0.1:1433?database=master&TrustServerCertificate=true
